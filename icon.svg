<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252526" />
      <stop offset="100%" stop-color="#1E1E1E" />
    </linearGradient>
    <linearGradient id="ic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E3E42" />
      <stop offset="100%" stop-color="#2D2D30" />
    </linearGradient>
    
    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer App Container -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg-grad)" stroke="#007ACC" stroke-width="12" filter="url(#shadow)"/>

  <!-- IC Pins (Left side) -->
  <path d="M 110 160 h 60 M 110 224 h 60 M 110 288 h 60 M 110 352 h 60" stroke="#CCCCCC" stroke-width="24" stroke-linecap="round"/>
  <!-- IC Pins (Right side) -->
  <path d="M 402 160 h -60 M 402 224 h -60 M 402 288 h -60 M 402 352 h -60" stroke="#CCCCCC" stroke-width="24" stroke-linecap="round"/>

  <!-- IC Body -->
  <rect x="160" y="110" width="192" height="292" rx="20" fill="url(#ic-grad)" stroke="#111111" stroke-width="8" filter="url(#shadow)"/>

  <!-- Pin 1 Indicator -->
  <circle cx="196" cy="146" r="10" fill="#111111" />

  <!-- The "Import / Manager" Accent -->
  <!-- Downward Arrow (Mint Green) -->
  <path d="M 256 180 v 110 M 216 250 l 40 40 l 40 -40" fill="none" stroke="#0F9D58" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Storage Tray / Base (Vibrant Blue) -->
  <path d="M 196 330 h 120" fill="none" stroke="#007ACC" stroke-width="28" stroke-linecap="round"/>
</svg>